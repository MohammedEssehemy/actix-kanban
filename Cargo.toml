[package]
name = "actix-kanban"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
fern = "0.7"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-native-tls", "chrono", "postgres", "macros"] }
actix-web = "4"
actix-files = "0.6"
futures = "0.3"