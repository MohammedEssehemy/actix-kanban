[package]
name = "actix-kanban"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
fern = "0.6"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "postgres"] }
actix-web = "4.0"
actix-files = "0.6"
futures = "0.3"